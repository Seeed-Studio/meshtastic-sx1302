[env:sensecap-m1]
extends = native_base
build_unflags =
  -I variants/native/portduino
build_flags =
  ${native_base.build_flags}
  -I variants/native/sensecap-m1
  -I variants/native/portduino
  -DSENSECAP_M1
  -DMESHTASTIC_USE_SX1302
  -DHAS_SCREEN=0
  -DHAS_GPS=0
  -DMESHTASTIC_EXCLUDE_SCREEN=1
  !pkg-config --libs libulfius --silence-errors || :
  !pkg-config --libs openssl --silence-errors || :
build_src_filter =
  ${native_base.build_src_filter}
  -<graphics/Panel_sdl.cpp>
  -<graphics/TFTDisplay.cpp>
lib_ignore =
  ${native_base.lib_ignore}
  LovyanGFX
